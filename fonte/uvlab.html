<!doctype html><html><body style="margin:0;background:#222"><canvas id="c" width="900" height="600"></canvas><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';
const L = new GLTFLoader(); L.setMeshoptDecoder(MeshoptDecoder);
window.extrair = async (id) => {
  const g = await L.loadAsync('models/tripo/' + id + '.glb');
  let m = null; g.scene.traverse(o => { if (o.isMesh && !m) m = o; });
  g.scene.updateMatrixWorld(true);
  const geo = m.geometry; const pos = geo.attributes.position, uv = geo.attributes.uv, idx = geo.index;
  const v = new THREE.Vector3(); const P = [], U = [];
  for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m.matrixWorld); P.push(+v.x.toFixed(4), +v.y.toFixed(4), +v.z.toFixed(4)); U.push(+uv.getX(i).toFixed(5), +uv.getY(i).toFixed(5)); }
  return { P, U, I: Array.from(idx.array), flipY: m.material.map ? m.material.map.flipY : null };
};
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true }); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping;
window.ver = async (id, tex) => {
  const g = await L.loadAsync('models/tripo/' + id + '.glb'); const cena = new THREE.Scene(); cena.background = new THREE.Color('#2a2436');
  cena.add(new THREE.HemisphereLight('#fff4dd', '#45304a', 2)); const dl = new THREE.DirectionalLight('#fff', 2.6); dl.position.set(2, 3, 4); cena.add(dl);
  if (tex) { const t = await new THREE.TextureLoader().loadAsync(tex); t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; g.scene.traverse(o => { if (o.isMesh) { o.material.map = t; o.material.needsUpdate = true; } }); }
  cena.add(new THREE.Mesh(new THREE.BoxGeometry(.1,.1,.1), new THREE.MeshBasicMaterial({color:'red'}))); cena.add(g.scene); g.scene.traverse(o => { if (o.isMesh) o.frustumCulled = false; }); console.log('dbg'); const box = new THREE.Box3().setFromObject(g.scene, true); const h = box.max.y - box.min.y; const c = box.getCenter(new THREE.Vector3()); console.log('box', JSON.stringify(box), h);
  const ctx = document.createElement('canvas').getContext('2d');
  const out = document.createElement('canvas'); out.width = 900; out.height = 600; const o2 = out.getContext('2d');
  const cam = new THREE.PerspectiveCamera(30, 300 / 600, .01, 20);
  R.setSize(300, 600, false);
  for (let i = 0; i < 3; i++) { const a = [0.35, Math.PI, Math.PI * .5][i]; const r = h * 2.1; cam.position.set(c.x + Math.sin(a) * r, c.y + h * .05, c.z + Math.cos(a) * r); cam.lookAt(c); R.render(cena, cam); o2.drawImage(R.domElement, i * 300, 0, 300, 600); }
  return out.toDataURL('image/png');
};
window.pronto = true;
</script></body></html>
